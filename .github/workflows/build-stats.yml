name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

env:
  # Transparent background with mid-tone colors so the cards read well in both GitHub's light and dark themes
  CARD_STYLE: disable_animations=true&bg_color=00000000&title_color=4169e1&text_color=8b949e&icon_color=4169e1&hide_border=true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&count_private=true&show_icons=true&custom_title=Robert%27s%20GitHub%20stats&${{ env.CARD_STYLE }}
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&${{ env.CARD_STYLE }}
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate umlaut pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=umlaut&${{ env.CARD_STYLE }}
          path: profile/pin-umlaut.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate qrisp pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=qrisp&${{ env.CARD_STYLE }}
          path: profile/pin-qrisp.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate typstry pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=typstry&${{ env.CARD_STYLE }}
          path: profile/pin-typstry.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate gosys1 pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=gosys1&${{ env.CARD_STYLE }}
          path: profile/pin-gosys1.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate go-json-crdt pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=go-json-crdt&${{ env.CARD_STYLE }}
          path: profile/pin-go-json-crdt.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate oakestra-dev-cli pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=oakestra-dev-cli&${{ env.CARD_STYLE }}
          path: profile/pin-oakestra-dev-cli.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
